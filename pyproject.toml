[project]
name = "python-pandas-notebooks-playground"
version = "0.1.0"
description = "Playground de notebooks marimo com pandas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "pyarrow>=18",
    "python-dotenv>=1.0",
    "marimo>=0.25.2",
    "altair>=6.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.uv]
# Projeto em /mnt/d (NTFS via WSL): hardlinks não funcionam entre sistemas de arquivos
link-mode = "copy"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# marimo exibe a última expressão da célula
"notebooks/**" = ["B018"]
